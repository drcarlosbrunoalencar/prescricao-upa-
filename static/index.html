<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prescrição UPA – Aparecida</title>
<style>
  :root {
    --bg:#ffffff;--card:#fff;--border:#e0ddd8;--text:#1a1a1a;--muted:#6b6b6b;
    --accent:#1a6b3c;--accent-light:#e8f5ee;--danger:#c0392b;--danger-light:#fdf0ef;
    --radius:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
  header img{height:36px}
  header h1{font-size:15px;font-weight:600}
  header span{font-size:12px;color:var(--muted)}
  .container{max-width:860px;margin:0 auto;padding:24px 16px 80px}
  .tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap}
  .tab{padding:9px 18px;font-size:13px;font-weight:500;border:none;background:transparent;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab:hover:not(.active){color:var(--text)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
  .sec{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:20px 0 10px;padding-top:16px;border-top:1px solid var(--border)}
  .sec:first-of-type{border-top:none;padding-top:0;margin-top:0}
  .row{display:grid;gap:10px;margin-bottom:10px}
  .c2{grid-template-columns:1fr 1fr}
  .field label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;font-weight:500}
  .field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;font-family:inherit;background:#ffffff;color:var(--text);transition:border .15s}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:#fff}
  .field textarea{resize:vertical;line-height:1.5;min-height:64px}
  .med-row{display:grid;grid-template-columns:minmax(0,3fr) 80px minmax(0,1.5fr) 120px 32px;gap:8px;align-items:end;margin-bottom:8px}
  .med-row .field label{font-size:11px}
  .rm-btn{height:36px;width:32px;background:transparent;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .rm-btn:hover{border-color:var(--danger);color:var(--danger)}
  .add-med{width:100%;padding:8px;font-size:12px;background:transparent;border:1px dashed var(--border);border-radius:var(--radius);cursor:pointer;color:var(--muted);margin-bottom:12px;transition:all .15s}
  .add-med:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
  .fixo-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
  .fixo-item:last-child{border-bottom:none}
  .fixo-item input[type=checkbox]{width:15px;height:15px;flex-shrink:0;accent-color:var(--accent);cursor:pointer}
  .fixo-item span{font-size:12px;color:var(--muted);flex:1}
  .del-fixo{background:transparent;border:none;cursor:pointer;color:var(--muted);font-size:15px;padding:2px 6px;border-radius:4px;flex-shrink:0}
  .del-fixo:hover{color:var(--danger);background:var(--danger-light)}
  .add-fixo-row{display:grid;grid-template-columns:minmax(0,3fr) 80px minmax(0,1.4fr) 120px auto;gap:8px;align-items:end;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border)}
  .add-fixo-row .field label{font-size:11px}
  .btn-add-fixo{padding:0 14px;font-size:12px;font-weight:600;height:36px;background:var(--accent-light);color:var(--accent);border:1px solid var(--accent);border-radius:var(--radius);cursor:pointer;white-space:nowrap}
  .btn-add-fixo:hover{background:var(--accent);color:#fff}
  /* Exames laboratoriais */
  .lab-group{margin-bottom:16px}
  .lab-group-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:6px;text-transform:uppercase}
  .lab-row{display:grid;grid-template-columns:140px repeat(5,1fr);gap:6px;align-items:center;margin-bottom:5px}
  .lab-row label{font-size:12px;color:var(--muted);font-weight:500}
  .lab-row input{padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;background:#ffffff;color:var(--text)}
  .lab-row input:focus{outline:none;border-color:var(--accent);background:#fff}
  .lab-date-row{display:grid;grid-template-columns:140px repeat(5,1fr);gap:6px;margin-bottom:8px}
  .lab-date-row span{font-size:11px;color:var(--muted);font-weight:600;text-align:center}
  .lab-date-row input{padding:4px 6px;border:1px solid var(--border);border-radius:var(--radius);font-size:11px;text-align:center;background:#fafaf9}
  /* Footer */
  .footer-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:12px 24px;display:flex;justify-content:flex-end;gap:10px;z-index:100}
  .btn-clear{padding:9px 18px;font-size:13px;background:transparent;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer}
  .btn-clear:hover{background:var(--bg)}
  .btn-print{padding:9px 24px;font-size:13px;font-weight:600;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);cursor:pointer}
  .btn-print:hover{opacity:.88}
  .toast{position:fixed;top:20px;right:20px;background:#222;color:#fff;padding:10px 18px;border-radius:var(--radius);font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
  .toast.show{opacity:1}

  /* ===== PRINT ===== */
  #print-area{display:none}
  @media print{
    body>*:not(#print-area){display:none!important}
    #print-area{display:block!important;position:static}
    @page{margin:1.2cm 1.5cm;size:A4}
    /* força impressão de imagens e cores de fundo */
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
    img{display:block!important;visibility:visible!important}
  }
  .p-doc{font-family:Arial,Helvetica,sans-serif;font-size:9pt;color:#000;width:100%}
  .p-logo{height:44px;margin-bottom:5px;display:block}
  .p-title-box{border:1px solid #000;text-align:center;padding:4px 0}
  .p-title-box p{font-size:10pt;font-weight:bold;line-height:1.7}
  .p-hrow{display:flex;border:1px solid #000;border-top:none}
  .p-hrow .hl{flex:1;padding:4px 6px;border-right:1px solid #000;font-size:9pt}
  .p-hrow .hr{width:150px;padding:4px 6px;font-size:9pt}
  table.pt{width:100%;border-collapse:collapse;margin-top:6px;font-size:8.5pt;table-layout:fixed;max-width:100%}
  table.pt th{border:1px solid #000;padding:4px 2px;text-align:center;font-weight:bold;background:#f0f0f0;font-size:8.5pt;overflow:hidden;word-wrap:break-word}
  table.pt td{border:1px solid #000;padding:0;height:17pt;vertical-align:middle;overflow:hidden}
  table.pt td span{display:block;padding:0 3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  table.pt td.bld span{font-weight:bold}
  .p-ev-title{border:1px solid #000;text-align:center;font-weight:bold;padding:4px;margin-top:8px;font-size:10pt}
  .p-ev-row{border:1px solid #000;border-top:none;padding:4px 6px;font-size:9pt}
  .p-ev-2col{display:flex}
  .p-ev-2col .col{flex:1;border:1px solid #000;border-top:none;padding:4px 6px;font-size:9pt}
  .p-ev-2col .col:last-child{border-left:none}
  .p-break{page-break-before:always}
  .p-lab-title{border:1px solid #000;text-align:center;font-weight:bold;padding:4px;margin-top:8px;font-size:10pt;background:#f0f0f0}
  table.plab{width:100%;border-collapse:collapse;font-size:8.5pt;table-layout:fixed}
  table.plab th{border:1px solid #000;padding:3px 4px;text-align:center;font-weight:bold;background:#f0f0f0}
  table.plab td{border:1px solid #000;padding:3px 4px;height:16pt}
  table.plab td.grp{font-weight:bold;background:#f8f8f8}
  table.plab td.sub{padding-left:14px}
  .p-imagem-box{border:1px solid #000;border-top:none;min-height:80px;padding:5px 6px;font-size:9pt}

  @media(max-width:600px){
    .c2,.lab-row,.lab-date-row{grid-template-columns:1fr}
    .med-row{grid-template-columns:1fr 70px}
    .add-fixo-row{grid-template-columns:1fr}
  }
</style>
</head>

  <div>
    <h1>Prescrição Médica — Enfermaria</h1>
    <span>UPA 24h · Aparecida de Goiânia</span>
  </div>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="setTab('presc',this)">Prescrição</button>
    <button class="tab" onclick="setTab('ev',this)">Evolução</button>
    <button class="tab" onclick="setTab('lab',this)">Exames Laboratoriais</button>
    <button class="tab" onclick="setTab('ambos',this)">Prescrição + Evolução</button>
  </div>

  <!-- CABEÇALHO -->
  <div class="card">
    <div class="sec">Cabeçalho do documento</div>
    <div class="row c2">
      <div class="field"><label>Nome do paciente</label><input id="nome" placeholder="Nome completo" autocomplete="off"></div>
      <div class="field"><label>Data de nascimento</label><input id="dn" placeholder="DD/MM/AAAA" autocomplete="off"></div>
    </div>
    <div class="row c2">
      <div class="field"><label>Hipótese diagnóstica (HD)</label><input id="hd" placeholder="ex: Pneumonia bacteriana" autocomplete="off"></div>
      <div class="field"><label>Leito</label><input id="leito" placeholder="ex: 12A"></div>
    </div>
    <div class="row c2" style="margin-top:0">
      <div class="field"><label>Data do documento</label><input type="date" id="data"></div>
    </div>
  </div>

  <!-- PRESCRIÇÃO -->
  <div id="sec_presc">
    <div class="card">
      <div class="sec">Dieta e hidratação venosa</div>
      <div class="row c2">
        <div class="field"><label>Dieta</label>
          <select id="dieta">
            <option value="">— selecionar —</option>
            <option>Via oral livre</option><option>Via oral livre – diabética</option>
            <option>Via oral livre – hiposódica</option><option>Dieta branda</option>
            <option>Dieta pastosa</option><option>Dieta líquida</option>
            <option>Jejum / zero via oral</option>
          </select>
        </div>
        <div class="field"><label>SF 0,9% — volume</label>
          <input id="sf" placeholder="ex: 500 ML — vazio para omitir">
        </div>
      </div>
      <div class="sec">Medicamentos do paciente</div>
      <div id="med_list"></div>
      <button class="add-med" onclick="addMed()">+ adicionar medicamento</button>
      <div class="sec">Itens padrão da UPA</div>
      <div id="fixos_list"></div>
      <div class="add-fixo-row">
        <div class="field"><label>Novo item padrão</label><input id="nf_med" placeholder="ex: Omeprazol 40mg 01cp"></div>
        <div class="field"><label>Via</label>
          <select id="nf_via"><option>VO</option><option>EV</option><option>IM</option><option>SC</option><option>INAL</option><option>SL</option><option value=""></option></select>
        </div>
        <div class="field"><label>Posologia</label><input id="nf_pos" placeholder="ex: 1x/dia"></div>
        <div class="field"><label>Tipo</label>
          <select id="nf_tipo"><option value=""></option><option>AGORA</option><option>SE NECESSÁRIO</option><option>ACM</option><option>CONTÍNUO</option><option>DOSE ÚNICA</option></select>
        </div>
        <button class="btn-add-fixo" onclick="addFixo()">+ Salvar</button>
      </div>
    </div>
  </div>

  <!-- EVOLUÇÃO -->
  <div id="sec_ev" style="display:none">
    <div class="card">
      <div class="sec">Evolução de enfermaria</div>
      <div class="row c2">
        <div class="field"><label>Dia de internação (DIH)</label><input id="dih" placeholder="ex: 1º"></div>
        <div class="field"><label>Hipótese(s) diagnóstica(s)</label><input id="ev_hd" placeholder="usa HD do cabeçalho se vazio"></div>
      </div>
      <div class="row"><div class="field"><label>Admissão</label><textarea id="admissao" placeholder="Resumo da admissão..."></textarea></div></div>
      <div class="row c2">
        <div class="field"><label>Comorbidades</label><textarea id="comorbidades" placeholder="ex: HAS, DM tipo 2..."></textarea></div>
        <div class="field"><label>Antecedentes</label><textarea id="antecedentes" placeholder="ex: Tabagista..."></textarea></div>
      </div>
      <div class="row"><div class="field"><label>ATB prévio</label><input id="atb" placeholder="ex: Não"></div></div>
      <div class="row"><div class="field"><label>Evolução médica</label><textarea id="ev_med" rows="3" placeholder="Evolução clínica..."></textarea></div></div>
      <div class="row"><div class="field"><label>Exame físico</label><textarea id="ef" rows="3" placeholder="Consciente, orientado..."></textarea></div></div>
      <div class="row"><div class="field"><label>Conduta</label><textarea id="conduta" rows="3" placeholder="Manter..."></textarea></div></div>
    </div>
  </div>

  <!-- EXAMES LABORATORIAIS -->
  <div id="sec_lab" style="display:none">
    <div class="card">
      <div class="sec">Datas das coletas (até 5 colunas)</div>
      <div class="lab-date-row">
        <span></span>
        <input id="d1" placeholder="Data 1" type="date">
        <input id="d2" placeholder="Data 2" type="date">
        <input id="d3" placeholder="Data 3" type="date">
        <input id="d4" placeholder="Data 4" type="date">
        <input id="d5" placeholder="Data 5" type="date">
      </div>

      <div class="sec">Gasometria arterial</div>
      <div id="lab_gaso"></div>

      <div class="sec">Hemograma</div>
      <div id="lab_hmg"></div>

      <div class="sec">Ureia / Creatinina / EAS</div>
      <div id="lab_ur"></div>

      <div class="sec">Íons</div>
      <div id="lab_ions"></div>

      <div class="sec">Outros</div>
      <div id="lab_outros"></div>

      <div class="sec">Exames de imagem</div>
      <div class="field"><textarea id="imagem" rows="3" placeholder="ex: RX tórax (18/04): condensação em base esquerda..."></textarea></div>
    </div>
  </div>
</div>

<div class="footer-bar">
  <button class="btn-clear" onclick="limpar()">Limpar</button>
  <button class="btn-print" onclick="imprimir()">🖨 Imprimir</button>
</div>
<div class="toast" id="toast"></div>
<div id="print-area"></div>

<script>
let mc=0, currentTab='presc';

// ===== ITENS PADRÃO =====
const FX_DEFAULT=[
  {med:'HEPARINA NAO FRACIONADA 5.000UI',via:'SC',pos:'',tipo:'',checked:true},
  {med:'DIPIRONA 500MG, 02CP, SE DOR E/OU FEBRE',via:'VO',pos:'',tipo:'SE NECESSÁRIO',checked:true},
  {med:'DIPIRONA 01 AMP + 10ML AD',via:'EV',pos:'',tipo:'SE NECESSÁRIO',checked:true},
  {med:'TRAMADOL 01 AMP + SF 0,9% 100 ML',via:'EV',pos:'',tipo:'ACM',checked:false},
  {med:'BROMOPRIDA 01 AMP, SE NAUSEAS E/OU VOMITOS',via:'EV',pos:'',tipo:'SE NECESSÁRIO',checked:true},
  {med:'DRAMIN 01 AMP',via:'IM',pos:'',tipo:'SE NECESSÁRIO',checked:false},
  {med:'CAPTOPRIL 25MG, 02CP, SE PA >= 160X110MMHG',via:'VO',pos:'',tipo:'ACM',checked:false},
  {med:'ATENSINA 0,100MG, 01CP, SE PA >= 160X110MMHG',via:'',pos:'',tipo:'',checked:false},
  {med:'HIDRALAZINA 01 AMP + AD 19ML, FAZER 05ML',via:'EV',pos:'',tipo:'ACM',checked:false},
  {med:'SF 0,9% 1.000ML',via:'EV',pos:'',tipo:'ACM',checked:false},
  {med:'O2 CONTINUO EM CN 2L/MIN, SE SATO2 < 92%',via:'INAL',pos:'',tipo:'ACM',checked:false},
  {med:'GH 50% 40ML, SE HGT<70MG/DL, EM BOLUS',via:'EV',pos:'',tipo:'SE NECESSÁRIO',checked:false},
  {med:'INSULINA REGULAR DE ACORDO COM HGT',via:'SC',pos:'',tipo:'SE NECESSÁRIO',checked:false},
  {med:'HGT',via:'SC',pos:'6/6H SE DM',tipo:'',checked:false},
  {med:'COMUNICAR INTERCORRENCIAS',via:'',pos:'',tipo:'',checked:true},
  {med:'CABECEIRA ELEVADA 30',via:'',pos:'',tipo:'',checked:true},
  {med:'SINAIS VITAIS + CGE',via:'',pos:'6/6H',tipo:'',checked:true},
];
function loadFixos(){try{return JSON.parse(localStorage.getItem('fixos_upa'))||FX_DEFAULT}catch(e){return FX_DEFAULT}}
function saveFixos(a){localStorage.setItem('fixos_upa',JSON.stringify(a))}
function renderFixos(){
  const arr=loadFixos(),el=document.getElementById('fixos_list');
  el.innerHTML='';
  arr.forEach((f,i)=>{
    const lbl=f.med+(f.via?' — '+f.via:'')+(f.pos?' '+f.pos:'')+(f.tipo?' '+f.tipo:'');
    const d=document.createElement('div');d.className='fixo-item';
    d.innerHTML=`<input type="checkbox" id="fx${i}" ${f.checked?'checked':''} onchange="toggleFixo(${i})">
      <span>${lbl}</span>
      <button class="del-fixo" onclick="delFixo(${i})" title="Remover">×</button>`;
    el.appendChild(d);
  });
}
function toggleFixo(i){const a=loadFixos();a[i].checked=document.getElementById('fx'+i).checked;saveFixos(a)}
function delFixo(i){const a=loadFixos();a.splice(i,1);saveFixos(a);renderFixos();toast('Item removido.')}
function addFixo(){
  const med=document.getElementById('nf_med').value.trim();
  if(!med){toast('Digite o medicamento.');return}
  const a=loadFixos();
  a.push({med:med.toUpperCase(),via:document.getElementById('nf_via').value,
    pos:document.getElementById('nf_pos').value,tipo:document.getElementById('nf_tipo').value,checked:true});
  saveFixos(a);renderFixos();
  document.getElementById('nf_med').value='';
  document.getElementById('nf_pos').value='';
  document.getElementById('nf_tipo').value='';
  toast('Item padrão salvo!');
}

// ===== EXAMES LAB =====
const LAB_GROUPS={
  lab_gaso:['PH','PO2','PCO2','HCO3','BE','SAT'],
  lab_hmg:['HB/HT','LEUCO','MIELO','M.MIELO','BAST','SEG','EOSI','LINF','MONO','PLAQ'],
  lab_ur:['UREIA','CREATININA','EAS'],
  lab_ions:['SÓDIO (NA)','POTÁSSIO (K)'],
  lab_outros:['PCR','LACTATO','TGO','TGP','LIPASE','AMILASE','FA','GGT','TROPONINA','CPK','CK-MB'],
};
function renderLab(){
  Object.entries(LAB_GROUPS).forEach(([gid,items])=>{
    const el=document.getElementById(gid);el.innerHTML='';
    items.forEach(item=>{
      const key=item.replace(/[^a-zA-Z0-9]/g,'_');
      const row=document.createElement('div');row.className='lab-row';
      row.innerHTML=`<label>${item}</label>
        <input id="l_${key}_1" placeholder="—">
        <input id="l_${key}_2" placeholder="—">
        <input id="l_${key}_3" placeholder="—">
        <input id="l_${key}_4" placeholder="—">
        <input id="l_${key}_5" placeholder="—">`;
      el.appendChild(row);
    });
  });
}

// ===== TABS =====
function setTab(t,el){
  currentTab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('sec_presc').style.display=(t==='ev'||t==='lab')?'none':'block';

function addMed(){
  mc++;
  const d=document.getElementById('med_list');
  const div=document.createElement('div');div.className='med-row';div.id='mr'+mc;
  div.innerHTML=`

      <select><option>VO</option><option>EV</option><option>IM</option><option>SC</option><option>INAL</option><option>SL</option></select>
    </div>

}

function v(id){return(document.getElementById(id)||{}).value||''}

function toast(msg,dur=2500){

  setTimeout(()=>t.classList.remove('show'),dur);
}
